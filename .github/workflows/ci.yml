name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Expenses.slnx
      - name: Test
        run: dotnet test tests/Expenses.Tests/Expenses.Tests.csproj -c Release --no-restore
      - name: Publish web app
        run: dotnet publish src/Expenses.Web/Expenses.Web.csproj -c Release --no-restore -o artifacts/web
      - name: Publish Functions
        run: dotnet publish src/Expenses.Functions/Expenses.Functions.csproj -c Release --no-restore -o artifacts/functions
      - uses: actions/upload-artifact@v7
        with:
          name: expenses
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
