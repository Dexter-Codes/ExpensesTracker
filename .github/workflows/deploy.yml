name: Deploy manually to Azure
on:
  workflow_dispatch:
    inputs:
      target:
        description: Component to deploy (configure Azure and OIDC first)
        type: choice
        options: [web, functions]
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure
    timeout-minutes: 25
    concurrency:
      group: azure-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Expenses.slnx
      - name: Test before deployment
        run: dotnet test tests/Expenses.Tests/Expenses.Tests.csproj -c Release --no-restore
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: inputs.target == 'web'
        run: dotnet publish src/Expenses.Web/Expenses.Web.csproj -c Release --no-restore -o artifacts/web
      - if: inputs.target == 'web'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEB_APP_NAME }}
          package: artifacts/web
      - if: inputs.target == 'functions'
        run: dotnet publish src/Expenses.Functions/Expenses.Functions.csproj -c Release --no-restore -o artifacts/functions
      - if: inputs.target == 'functions'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: artifacts/functions
