apiVersion: v1
kind: ServiceAccount
metadata:
  name: expenses
  annotations:
    azure.workload.identity/client-id: REPLACE_WITH_MANAGED_IDENTITY_CLIENT_ID
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expenses
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expenses
  template:
    metadata:
      labels:
        app: expenses
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: expenses
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      containers:
        - name: web
          image: REPLACE_WITH_REGISTRY.azurecr.io/expenses:v1
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Database__Provider
              value: SqlServer
            - name: ConnectionStrings__DefaultConnection
              value: "Server=tcp:REPLACE.database.windows.net,1433;Database=expenses;Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False"
            - name: App__BaseUrl
              value: "https://REPLACE_WITH_YOUR_APP_HOST"
            - name: Notifications__QueueUri
              value: "https://REPLACE.queue.core.windows.net/expense-emails"
            - name: DataProtection__KeyPath
              value: /keys
          volumeMounts:
            - name: keys
              mountPath: /keys
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: keys
          persistentVolumeClaim:
            claimName: expenses-keys
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: expenses-keys
spec:
  accessModes: [ReadWriteMany]
  storageClassName: azurefile-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: expenses
spec:
  type: ClusterIP
  selector:
    app: expenses
  ports:
    - port: 80
      targetPort: 8080
